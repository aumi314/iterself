name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test data layer
        run: npm test

      - name: Build renderer assets
        run: npm run build:renderer

      - name: Run smoke checks
        run: npm run smoke

  package-windows:
    name: Package on Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test data layer
        run: npm test

      - name: Build renderer assets
        run: npm run build:renderer

      - name: Run smoke checks
        run: npm run smoke

      - name: Package application
        run: npm run pack

      - name: Verify packaged app
        run: npm run verify
